<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="Architecture: browser, Express API, MongoDB, OpenRouter, Razorpay, Firebase" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="1000" height="480" rx="20" fill="#f0fdf4"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">

    <!-- Firebase -->
    <rect x="40" y="40" width="240" height="80" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="160" y="76" font-size="18" font-weight="700" fill="#064e3b">Firebase Auth</text>
    <text x="160" y="98" font-size="14" fill="#4b5563">Google sign-in</text>

    <!-- Browser -->
    <rect x="40" y="190" width="240" height="130" rx="16" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
    <text x="160" y="228" font-size="19" font-weight="700" fill="#064e3b">Browser</text>
    <text x="160" y="252" font-size="14" fill="#065f46">React + Vite</text>
    <text x="160" y="272" font-size="14" fill="#065f46">Redux, Web Speech API</text>
    <text x="160" y="292" font-size="14" fill="#065f46">Razorpay checkout popup</text>

    <!-- API -->
    <rect x="380" y="190" width="240" height="130" rx="16" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
    <text x="500" y="228" font-size="19" font-weight="700" fill="#064e3b">Express API</text>
    <text x="500" y="252" font-size="14" fill="#065f46">Auth, Interview, Payment</text>
    <text x="500" y="272" font-size="14" fill="#065f46">JWT cookie</text>
    <text x="500" y="292" font-size="14" fill="#065f46">Resume upload (Multer)</text>

    <!-- right column -->
    <rect x="720" y="40" width="240" height="80" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="840" y="76" font-size="18" font-weight="700" fill="#064e3b">MongoDB</text>
    <text x="840" y="98" font-size="14" fill="#4b5563">users, interviews</text>

    <rect x="720" y="215" width="240" height="80" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="840" y="251" font-size="18" font-weight="700" fill="#064e3b">OpenRouter</text>
    <text x="840" y="273" font-size="14" fill="#4b5563">questions and feedback</text>

    <rect x="720" y="380" width="240" height="80" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="840" y="416" font-size="18" font-weight="700" fill="#064e3b">Razorpay</text>
    <text x="840" y="438" font-size="14" fill="#4b5563">orders and payments</text>

    <!-- arrows -->
    <g stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#a)">
      <path d="M160 190V124"/>
      <path d="M284 255H376"/>
      <path d="M620 215L716 100"/>
      <path d="M620 255H716"/>
      <path d="M620 295L716 400"/>
    </g>

    <!-- labels -->
    <g font-size="13" fill="#047857" font-weight="600">
      <text x="206" y="162" text-anchor="start">sign in</text>
      <text x="330" y="240">REST</text>
      <text x="330" y="282">+ cookie</text>
    </g>
  </g>
</svg>
