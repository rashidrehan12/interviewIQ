<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="250" viewBox="0 0 1140 250" role="img" aria-label="Interview flow: sign in, set up, questions, answer, feedback, report" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="1140" height="250" rx="20" fill="#f0fdf4"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- nodes -->
    <g>
      <rect x="30" y="50" width="150" height="80" rx="16" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
      <text x="105" y="84" font-size="17" font-weight="700" fill="#064e3b">1. Sign in</text>
      <text x="105" y="106" font-size="14" fill="#065f46">with Google</text>
    </g>
    <g>
      <rect x="216" y="50" width="150" height="80" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
      <text x="291" y="84" font-size="17" font-weight="700" fill="#064e3b">2. Set up</text>
      <text x="291" y="106" font-size="14" fill="#4b5563">role, mode, resume</text>
    </g>
    <g>
      <rect x="402" y="50" width="150" height="80" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
      <text x="477" y="84" font-size="17" font-weight="700" fill="#064e3b">3. Question</text>
      <text x="477" y="106" font-size="14" fill="#4b5563">AI asks it aloud</text>
    </g>
    <g>
      <rect x="588" y="50" width="150" height="80" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
      <text x="663" y="84" font-size="17" font-weight="700" fill="#064e3b">4. Answer</text>
      <text x="663" y="106" font-size="14" fill="#4b5563">voice or text, timed</text>
    </g>
    <g>
      <rect x="774" y="50" width="150" height="80" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
      <text x="849" y="84" font-size="17" font-weight="700" fill="#064e3b">5. Feedback</text>
      <text x="849" y="106" font-size="14" fill="#4b5563">score per answer</text>
    </g>
    <g>
      <rect x="960" y="50" width="150" height="80" rx="16" fill="#a7f3d0" stroke="#059669" stroke-width="2"/>
      <text x="1035" y="84" font-size="17" font-weight="700" fill="#064e3b">6. Report</text>
      <text x="1035" y="106" font-size="14" fill="#065f46">history and PDF</text>
    </g>

    <!-- arrows -->
    <g stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#a)">
      <path d="M180 90H212"/>
      <path d="M366 90H398"/>
      <path d="M552 90H584"/>
      <path d="M738 90H770"/>
      <path d="M924 90H956"/>
    </g>

    <!-- repeat bracket under steps 3 to 5 -->
    <path d="M477 134V170H849V134" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 6"/>
    <rect x="538" y="156" width="250" height="30" rx="15" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="663" y="176" font-size="14" font-weight="600" fill="#047857">Repeat for every question</text>
  </g>
</svg>
