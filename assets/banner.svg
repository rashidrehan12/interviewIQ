<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="InterviewIQ.AI banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#dots)"/>

  <!-- logo tile -->
  <rect x="80" y="86" width="84" height="84" rx="22" fill="url(#logo)"/>
  <rect x="104" y="114" width="36" height="28" rx="8" fill="#064e3b"/>
  <circle cx="115" cy="128" r="4" fill="#a7f3d0"/>
  <circle cx="129" cy="128" r="4" fill="#a7f3d0"/>
  <rect x="119" y="100" width="4" height="10" rx="2" fill="#064e3b"/>
  <circle cx="121" cy="98" r="4" fill="#064e3b"/>

  <!-- text -->
  <text x="188" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">InterviewIQ.AI</text>
  <text x="84" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#d1fae5">Practice interviews with an AI that listens, scores and gives feedback.</text>

  <!-- pills -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ecfdf5">
    <rect x="84" y="244" width="190" height="38" rx="19" fill="#ffffff" fill-opacity="0.16"/>
    <text x="108" y="269">Voice interviews</text>
    <rect x="290" y="244" width="190" height="38" rx="19" fill="#ffffff" fill-opacity="0.16"/>
    <text x="314" y="269">Scored feedback</text>
    <rect x="496" y="244" width="170" height="38" rx="19" fill="#ffffff" fill-opacity="0.16"/>
    <text x="520" y="269">PDF reports</text>
  </g>

  <!-- report card illustration -->
  <g transform="translate(830 52)">
    <rect width="290" height="216" rx="22" fill="#ffffff"/>
    <circle cx="52" cy="52" r="26" fill="none" stroke="#10b981" stroke-width="7"/>
    <text x="52" y="59" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#059669">8.4</text>
    <text x="96" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Overall score</text>
    <text x="96" y="68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">Sample report</text>

    <text x="26" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563">Confidence</text>
    <rect x="26" y="122" width="238" height="9" rx="4.5" fill="#e5e7eb"/>
    <rect x="26" y="122" width="190" height="9" rx="4.5" fill="#10b981"/>

    <text x="26" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563">Communication</text>
    <rect x="26" y="164" width="238" height="9" rx="4.5" fill="#e5e7eb"/>
    <rect x="26" y="164" width="166" height="9" rx="4.5" fill="#10b981"/>

    <text x="26" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563">Correctness</text>
    <rect x="26" y="206" width="238" height="9" rx="4.5" fill="#e5e7eb"/>
    <rect x="26" y="206" width="214" height="9" rx="4.5" fill="#10b981"/>
  </g>
</svg>
